services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tanalista
      POSTGRES_USER: tanalista
      POSTGRES_PASSWORD: tanalista_pass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tanalista -d tanalista"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
