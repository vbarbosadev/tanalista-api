name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up toolchain
        uses: jdx/mise-action@v3

      - name: Run CI tasks
        run: mise run ci
      - name: Publish Java test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: |
            api/target/surefire-reports/
            api/target/failsafe-reports/
          if-no-files-found: warn

  sprint1-smoke:
    name: Compose, migrations and CRUD smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_FILE: docker-compose.yml:compose.smoke.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify clean clone uses only local Compose defaults
        run: test ! -e .env
      - name: Validate and start Compose
        run: |
          docker compose config --quiet
          docker compose up -d --build --wait
      - name: Verify CRUD, validation and OpenAPI
        run: node scripts/smoke-sprint1.mjs
      - name: Verify REST to Go to controlled HTTP provider
        run: node scripts/smoke-barcode.mjs
      - name: Verify API and CRUD remain available without Go
        run: |
          docker compose stop barcode
          node scripts/smoke-barcode.mjs --down
          node scripts/smoke-sprint1.mjs
          docker compose up -d --wait barcode
      - name: Seed persistence check
        run: node scripts/smoke-sprint1.mjs --seed
      - name: Verify identity is disabled by default outside dev
        run: |
          DEV_IDENTITY_ENABLED=false docker compose up -d --no-deps api
          node scripts/smoke-sprint1.mjs --disabled
      - name: Verify another identity cannot access resources
        run: |
          DEV_USER_ID=00000000-0000-0000-0000-000000000002 docker compose up -d --no-deps api
          node scripts/smoke-sprint1.mjs --hidden
      - name: Verify data after API recreation
        run: |
          docker compose up -d --no-deps api
          node scripts/smoke-sprint1.mjs --verify
      - name: Compose logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop isolated environment
        if: always()
        run: docker compose down
