quarkus.http.port=8081

quarkus.grpc.clients.barcode.host=${BARCODE_GRPC_HOST:localhost}
quarkus.grpc.clients.barcode.port=${BARCODE_GRPC_PORT:9090}
quarkus.grpc.clients.barcode.plain-text=true
tanalista.barcode.timeout-ms=${BARCODE_TIMEOUT_MS:2500}

quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=false
quarkus.datasource.username=${DB_USER:}
quarkus.datasource.password=${DB_PASSWORD:}
quarkus.datasource.jdbc.url=${DB_URL:}
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true

tanalista.dev-identity.enabled=${DEV_IDENTITY_ENABLED:false}
%dev.tanalista.dev-identity.enabled=${DEV_IDENTITY_ENABLED:true}
tanalista.dev-identity.user-id=${DEV_USER_ID:00000000-0000-0000-0000-000000000001}

# JWT access-token resource server; no login, accounts or provider discovery.
tanalista.auth.enabled=${AUTH_ENABLED:false}
tanalista.auth.local-enabled=${LOCAL_AUTH_ENABLED:false}
tanalista.auth.private-key-path=${JWT_PRIVATE_KEY_PATH:unconfigured}
# Local signing uses only a file outside Git; no automatic production key generation.
mp.jwt.verify.publickey.location=${OIDC_JWKS_URL:unconfigured}
mp.jwt.verify.issuer=${OIDC_ISSUER:unconfigured}
mp.jwt.verify.audiences=${OIDC_AUDIENCE:unconfigured}
mp.jwt.verify.publickey.algorithm=RS256
mp.jwt.verify.clock.skew=30
quarkus.http.limits.max-body-size=16K
smallrye.jwt.required.claims=iss,sub,aud,iat,exp
# JWTParser is called by the request identity adapter so failures use Problem Details.
quarkus.http.auth.proactive=false

quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=TáNaLista
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=CRUD e consulta de código de barras. Bearer JWT quando AUTH_ENABLED=true; identidade fixa somente para demonstração privada.

%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:tanalista;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.flyway.migrate-at-start=false
%test.tanalista.auth.local-enabled=false
%test.tanalista.auth.enabled=false
