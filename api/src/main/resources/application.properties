quarkus.http.port=8081

quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=false
quarkus.datasource.username=${DB_USER:}
quarkus.datasource.password=${DB_PASSWORD:}
quarkus.datasource.jdbc.url=${DB_URL:}
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true

tanalista.dev-identity.enabled=${DEV_IDENTITY_ENABLED:false}
%dev.tanalista.dev-identity.enabled=${DEV_IDENTITY_ENABLED:true}
tanalista.dev-identity.user-id=${DEV_USER_ID:00000000-0000-0000-0000-000000000001}

quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=TáNaLista — CRUD da Sprint 1
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Lista e Item persistidos. Identidade local de desenvolvimento; não há autenticação real nesta sprint.

%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:tanalista;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.flyway.migrate-at-start=false
